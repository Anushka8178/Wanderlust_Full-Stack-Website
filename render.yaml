# Render Blueprint - deploy as Web Service
# Docs: https://render.com/docs/blueprint-spec
# Important: leave "Root Directory" blank so the app runs from repo root.
services:
  - type: web
    name: majorproject
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Add these in Render Dashboard -> Environment (never commit real values):
      # ATLASDB_URL, SECRET, CLOUD_NAME, CLOUD_API_KEY, CLOUD_API_SECRET, MAPTOKEN
